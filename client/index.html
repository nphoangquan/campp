<!doctype html>
<html lang="en" class="app-loading">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Camp</title>
    <script>
      try {
        var p = localStorage.getItem('camp-theme');
        var dark = p === 'dark' || ((p === null || p === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
    <style>
      html.app-loading, html.app-loading body { margin:0;padding:0;overflow:hidden;height:100%; }
      html.app-loading #root { height:100%; overflow:hidden; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Tiny5&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <div id="app-loading">
        <div class="al-mark">
          <span class="al-rail"></span>
          <span class="al-tick"></span>
          <span class="al-word">CAMP</span>
        </div>
      </div>
    </div>
    <style>
      #app-loading{height:100%;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#e9edf1;color:#121314;overflow:hidden}
      html[data-theme=dark] #app-loading{background:#121314;color:#e9edf1}
      .al-mark{display:flex;align-items:center;gap:14px}
      .al-rail{display:block;width:1px;height:48px;background:currentColor}
      .al-tick{display:block;width:28px;height:7px;box-sizing:border-box;border-top:2px solid #c98200;border-bottom:2px solid #c98200;animation:al-pulse 1s ease-in-out infinite alternate}
      html[data-theme=dark] .al-tick{border-color:#e4ae39}
      .al-word{font:400 22px/1 'Tiny5',monospace;letter-spacing:.06em}
      @keyframes al-pulse{from{opacity:.35}to{opacity:1}}
      @media (prefers-reduced-motion:reduce){#app-loading *{animation:none!important}}
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
